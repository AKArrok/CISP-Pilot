name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      # 不安装 sentence-transformers/torch：离线测试不会加载本地模型。
      - name: Install offline test dependencies
        run: >-
          pip install pytest httpx python-dotenv pydantic jieba numpy scipy
          scikit-learn sqlalchemy alembic pymysql fastapi fsrs langgraph pymupdf
          langchain-openai

      - name: Offline regression
        env:
          CISP_DB_PATH: ${{ runner.temp }}/cisp-ci.db
          DATABASE_URL: ""
          MYSQL_PASSWORD: ""
        run: python -B tests/run_ci_suite.py
