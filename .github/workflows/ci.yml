name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install locked build tools
        run: python -m pip install --require-hashes -r requirements-build.lock.txt

      # 不安装 sentence-transformers/torch：离线测试不会加载本地模型。
      - name: Install offline test dependencies
        run: python -m pip install --no-build-isolation --require-hashes -r requirements-ci.lock.txt

      - name: Lint
        run: ruff check .

      - name: Offline regression
        env:
          CISP_DB_PATH: ${{ runner.temp }}/cisp-ci.db
          DATABASE_URL: ""
          MYSQL_PASSWORD: ""
          PYTHON_DOTENV_DISABLED: "1"
        run: python -B tests/run_ci_suite.py

      - name: Synthetic answer evaluation gate
        env:
          PYTHON_DOTENV_DISABLED: "1"
        run: python scripts/eval_answer_workflow.py --mode offline --output-dir "${{ runner.temp }}/answer-evaluation"

      - name: Build Linux runtime image
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${{ runner.temp }}/cisp-docker-smoke"
          docker build --platform linux/amd64 --tag "cisp-ci:${{ github.sha }}" . 2>&1 | tee "${{ runner.temp }}/cisp-docker-smoke/build.log"

      - name: Synthetic Docker runtime smoke
        env:
          CISP_DB_PATH: ${{ runner.temp }}/cisp-docker-smoke/parent-bait.db
          DATABASE_URL: ""
          MYSQL_PASSWORD: ""
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "1"
          PYTHON_DOTENV_DISABLED: "1"
        shell: bash
        run: |
          set -o pipefail
          python -B tests/docker_runtime_smoke.py \
            --image "cisp-ci:${{ github.sha }}" \
            --data-dir "${{ runner.temp }}/cisp-docker-smoke/data" \
            --evidence-dir "${{ runner.temp }}/cisp-docker-smoke/evidence" 2>&1 | tee "${{ runner.temp }}/cisp-docker-smoke/smoke.log"

      - name: Preserve Docker failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-docker-evidence
          path: |
            ${{ runner.temp }}/cisp-docker-smoke/build.log
            ${{ runner.temp }}/cisp-docker-smoke/smoke.log
            ${{ runner.temp }}/cisp-docker-smoke/evidence/docker.log
            ${{ runner.temp }}/cisp-docker-smoke/evidence/summary.json
            ${{ runner.temp }}/cisp-docker-smoke/evidence/inspect.json
            ${{ runner.temp }}/cisp-docker-smoke/evidence/ownership.json
            ${{ runner.temp }}/cisp-docker-smoke/evidence/container-id.txt
          if-no-files-found: ignore

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for smoke
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/cisp-browser-runtime/browsers
        run: npx --no-install playwright install --with-deps chromium

      - name: Synthetic Linux browser smoke
        run: >-
          python -B tests/linux_browser_smoke.py
          --source-root "$GITHUB_WORKSPACE"
          --work-dir "${{ runner.temp }}/cisp-browser-smoke"
          --node "$(command -v node)"
          --playwright-module "$GITHUB_WORKSPACE/node_modules/playwright"
          --browser-root "${{ runner.temp }}/cisp-browser-runtime"

      - name: Preserve browser failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-logs
          path: ${{ runner.temp }}/cisp-browser-smoke/*.log
          if-no-files-found: ignore
